name: データ更新と公開
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-gh-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 公開中の前回データを取得
        run: |
          mkdir -p .cache
          if git show origin/gh-pages:data.json > .cache/previous-data.json; then
            echo '前回データを取得しました'
          else
            rm -f .cache/previous-data.json
            echo '前回データはありません'
          fi
      - run: npm run build:data
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: 公開物を完成させて検証
        run: |
          touch dist/.nojekyll
          test -f dist/.nojekyll
          test -s dist/index.html
          test -s dist/data.json
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {validateData} from './src/lib/schema.js'; if (!validateData(JSON.parse(readFileSync('dist/data.json','utf8'))).ok) process.exit(1);"
          npm run check:pii
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  /tmp/gitleaks.tar.gz' | sha256sum -c
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir --redact --no-banner --exit-code 1 dist/
      - name: ブラウザで公開物を確認
        run: |
          npx playwright install --with-deps chromium webkit
          npm run test:e2e
      - name: gh-pages に公開
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init
          git checkout --orphan gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m '新作集を更新'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages --force
